{% extends "base.html" %}

{% block content %}
<h1>Inventory</h1>

{% if items|length == 0 %}
<p>No items in inventory yet.</p>
{% else %}
<table>
    <tr>
        <th>Name</th>
        <th>SKU</th>
        <th>Quantity</th>
        <th>Price</th>
    </tr>
    {% for item in items %}
    <tr>
        <td>{{ item['name'] }}</td>
        <td>{{ item['sku'] }}</td>
        <td>{{ item['quantity'] }}</td>
        <td>${{ item['price'] }}</td>
    </tr>
    {% endfor %}
</table>
{% endif %}
{% endblock %}
